name: CI

on:
  push:
    branches:
      - master
  pull_request:
    branches:
      - master

# A newer push to the same branch makes an in-flight run obsolete.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  DOTNET_VERSION: "10.0.x"
  # Target framework of the executable projects. Referenced in output paths below,
  # so it only needs changing here when the tooling projects are retargeted.
  EXE_TFM: net10.0

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          # MinVer derives the version from git history and tags.
          fetch-depth: 0

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: ${{ env.DOTNET_VERSION }}

      - name: Build
        run: dotnet build src/moonsharp_ci.sln -c Release -v minimal

      # The TAP suite resolves its TestMore/** data files relative to the process
      # working directory, so the runner has to be started from its own output
      # directory. Running it from the repo root silently fails ~34 tests.
      - name: Unit tests
        working-directory: src/TestRunners/DotNetCoreTestRunner/bin/Release/${{ env.EXE_TFM }}
        run: dotnet DotNetCoreTestRunner.dll /unit

      - name: Smoke test - CLI evaluates a script from stdin
        run: |
          set -euo pipefail
          dotnet run --project src/MoonSharp/MoonSharp.csproj -c Release --no-build \
            < src/MoonSharp/ci-smoke.lua > cli-smoke.log
          cat cli-smoke.log
          grep -q "24" cli-smoke.log

      - name: Smoke test - hardwire codegen (/dump-types -> -W)
        run: |
          set -euo pipefail
          mkdir -p .artifacts/hardwire
          dotnet run --project src/TestRunners/DotNetCoreTestRunner/DotNetCoreTestRunner.csproj \
            -c Release --no-build -- /dump-types .artifacts/hardwire/testdump.lua
          dotnet run --project src/MoonSharp/MoonSharp.csproj -c Release --no-build -- \
            -W .artifacts/hardwire/testdump.lua .artifacts/hardwire/HardwiredTypes.cs
          test -s .artifacts/hardwire/testdump.lua
          test -s .artifacts/hardwire/HardwiredTypes.cs
          grep -q "StringBuilder" .artifacts/hardwire/testdump.lua
          grep -q "StringBuilder" .artifacts/hardwire/HardwiredTypes.cs
